name: Radio Multi BACKFILL

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Stacja"
        required: true
        type: choice
        options:
          - nowyswiat
          - chillizet
          - radiozet
          - trojka
          - czworka

concurrency:
  group: radio-multi-${{ inputs.station }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill station archive
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

          STATION_KEY: ${{ inputs.station }}
          SYNC_MODE: "backfill"
          MAX_TRACKS: "5000"

          # Celowo mały budżet: wszystkie stacje korzystają z tej samej quota.
          MAX_SEARCH_REQUESTS: "10"
          MAX_RUNTIME_SECONDS: "900"
          MAX_INLINE_RETRY_SECONDS: "15"
          MISS_RETRY_DAYS: "7"
          BACKFILL_DAYS_PER_RUN: "1"

        run: python -u sync_odsluchane_station.py

      - name: Persist station state
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(.radio_state_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No state files to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .radio_state_*.json

          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi

          git commit -m "Update radio state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
